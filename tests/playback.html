<!doctype html><html lang="en"><meta charset="utf-8"><title>Hayase playback handoff fixture</title>
<main><h1>One Piece</h1><button id="watch">Watch Now</button></main>
<script>
window.chrome = { runtime: { sendMessage: async request => {
  window.latestRequest = request;
  if (window.delayLatest) await new Promise(resolve => setTimeout(resolve, 100));
  return { ok: true, episode: 1121 };
} } };
document.getElementById('watch').onclick = () => {
  const dialog = document.createElement('div'); dialog.setAttribute('role', 'dialog');
  dialog.innerHTML = '<div class="text-2xl">One Piece</div><input type="number" value="7"><button>Auto Select Torrent</button>';
  const input = dialog.querySelector('input');
  input.oninput = () => { window.queriedEpisode = Number(input.value); };
  dialog.querySelector('button').onclick = () => { window.startedEpisode = window.queriedEpisode; dialog.remove(); };
  document.body.append(dialog);
};
window.runPlaybackTests = async () => {
  const results = [];
  const assert = (condition, message) => { if (!condition) throw new Error(message); results.push(message); };
  location.hash = '#/app/home';
  await new Promise(resolve => setTimeout(resolve, 30));
  await hayasePlayLatest({ mediaId: 21, episode: 1100, title: 'One Piece' });
  assert(window.latestRequest.type === 'latest-episode' && window.latestRequest.mediaId === 21, 'Playback looks up the current latest aired episode');
  assert(location.hash === '#/app/anime/21', 'Playback opens the matching native anime route');
  assert(window.queriedEpisode === 1121, 'Native source input uses the latest episode rather than watched progress or an older card');
  assert(window.startedEpisode === 1121, 'Native Auto Select Torrent is invoked after changing the episode');
  delete window.startedEpisode; window.delayLatest = true;
  const playback = hayasePlayLatest({ mediaId: 21, episode: 1100, title: 'One Piece' });
  location.hash = '#/app/schedule';
  await playback;
  assert(location.hash === '#/app/schedule' && window.startedEpisode === undefined, 'Navigating away cancels pending playback');
  return { passed: results.length, results };
};
</script><script src="../plugin/playback.js"></script></html>
